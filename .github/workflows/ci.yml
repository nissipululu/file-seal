name: ci

on:
  push:
    branches: [main]
  pull_request:

# The least a job needs: read the code. Nothing here can write to the repository.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"

  test:
    # The attack tests are proven on a Mac. Windows and Linux are build only until someone runs them there.
    name: attack tests (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Run the attack tests
        run: dotnet run --project SonsetSeal.Tests -c Release
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          SONSETSEAL_NOTIFY: "off"
