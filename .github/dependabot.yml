# The program has no outside packages. The only things that can go out of date are the automation steps themselves.
# CodeQL's init and analyze steps have to be the same version, so they come as one pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
